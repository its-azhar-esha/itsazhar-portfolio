name: keepalive

on:
  schedule:
    # Daily noon UTC — keeps Supabase Free-plan project awake
    # (projects pause after ~7 days without API requests).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (with retries)
        env:
          # Override with a repository variable HEALTH_URL when the public
          # domain moves (e.g. itsazhar.com); defaults to the current
          # platform domain. No workflow edits needed for the switch.
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://itsazhar-portfolio.vercel.app/api/health' }}
        run: |
          set +e
          STATUS=0
          HEADER_ARGS=()
          # When HEALTH_CRON_SECRET is configured as a repository secret, the
          # GitHub fallback is treated as an authoritative keep-alive and also
          # records the health_checks ledger row. If unset, this resolves to an
          # empty value and the endpoint still answers the probe.
          if [ -n "${{ secrets.HEALTH_CRON_SECRET }}" ]; then
            HEADER_ARGS=(-H "x-health-key: ${{ secrets.HEALTH_CRON_SECRET }}")
          fi
          for attempt in 1 2 3; do
            echo "attempt $attempt..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              "${HEADER_ARGS[@]}" \
              "${HEALTH_URL}")
            echo "health status: $STATUS"
            # 200 = ok, 429/5xx = transient -> retry with backoff
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          # Only the endpoint recording failures, not this workflow,
          # is the source of truth; a non-200 here is still surfaced.
          if [ "$STATUS" != "200" ]; then exit 1; fi
